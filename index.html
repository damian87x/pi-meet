<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Meet</title>
<style>
  :root { color-scheme: dark; --bg:#202124; --bar:#3c4043; --tile:#3c4043; --fg:#e8eaed; --mut:#9aa0a6; --you:#8ab4f8; --talk:#81c995; --leave:#ea4335; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font: 14px/1.4 "Google Sans", ui-sans-serif, system-ui; background:var(--bg); color:var(--fg); }
  button, input, select { font: inherit; }
  #lobby, #call { min-height:100%; }
  #call { display:none; flex-direction:column; height:100%; }
  body.in-call #lobby { display:none; }
  body.in-call #call { display:flex; }

  #lobby { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; }
  #lobby h1 { margin:0; font-size:28px; font-weight:400; }
  #preview-wrap { width:min(720px, 92vw); aspect-ratio:16/9; background:#000; border-radius:16px; overflow:hidden; position:relative; }
  #preview { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #preview-off { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:48px; background:#3c4043; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  input, select { background:#303134; color:var(--fg); border:1px solid #5f6368; border-radius:8px; padding:10px 12px; }
  .btn { border:0; border-radius:24px; padding:10px 22px; cursor:pointer; }
  .btn-join { background:#1a73e8; color:#fff; font-size:16px; }
  .icon { width:48px; height:48px; border-radius:50%; border:0; background:var(--bar); color:#fff; cursor:pointer; }
  .icon.off { background:#5f6368; }
  .icon.leave { background:var(--leave); width:auto; padding:0 20px; border-radius:24px; }

  #stage { flex:1; display:grid; gap:12px; padding:16px 16px 88px; align-content:center; justify-content:center; overflow:auto; }
  #stage.n1 { grid-template-columns:minmax(280px, 920px); }
  #stage.n2 { grid-template-columns:repeat(2, minmax(220px, 1fr)); }
  #stage.n3, #stage.n4 { grid-template-columns:repeat(2, minmax(200px, 1fr)); }
  #stage.n5, #stage.n6 { grid-template-columns:repeat(3, minmax(180px, 1fr)); }
  .tile { position:relative; background:var(--tile); border-radius:12px; overflow:hidden; aspect-ratio:16/9; min-width:0; border:3px solid transparent; }
  .tile.you { border-color:transparent; }
  .tile.talk { border-color:var(--talk); }
  .tile video { width:100%; height:100%; object-fit:cover; background:#000; transform:scaleX(-1); }
  .tile .avatar { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:500; }
  .tile .meta { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.55); padding:4px 8px; border-radius:6px; font-size:12px; max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .kind { opacity:.75; font-size:11px; }

  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:12px; padding:14px; background:linear-gradient(transparent, #202124 40%); }
  #status { position:fixed; top:12px; left:50%; transform:translateX(-50%); color:var(--mut); font-size:13px; }

  #chat { position:fixed; top:0; right:0; bottom:0; width:min(360px, 92vw); background:#17181b; border-left:1px solid #3c4043; display:none; flex-direction:column; }
  body.chat-open #chat { display:flex; }
  #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { background:#303134; border-radius:8px; padding:8px 10px; overflow-wrap:anywhere; }
  .msg b { display:block; font-size:12px; color:var(--mut); }
  #chatform { display:flex; gap:8px; padding:10px; }
  #typed { flex:1; min-width:0; }
</style>

<div id="lobby">
  <h1>Pi Meet</h1>
  <div id="preview-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div id="preview-off">Cam off</div>
  </div>
  <div class="row">
    <select id="rooms"><option value="">New meeting</option></select>
    <input id="newroom" placeholder="Meeting name" size="16" />
    <input id="myrole" placeholder="Your name (optional)" size="16" />
  </div>
  <div class="row">
    <button type="button" class="icon" id="lobby-mic" title="Microphone">Mic</button>
    <button type="button" class="icon" id="lobby-cam" title="Camera">Cam</button>
    <button type="button" class="btn btn-join" id="join">Join now</button>
  </div>
  <p id="lobby-status" style="color:var(--mut);margin:0">Camera preview · then join. Agents join from Pi with /meet join</p>
</div>

<div id="call">
  <div id="status">connecting</div>
  <main id="stage"></main>
  <div id="bar">
    <button type="button" class="icon" id="mic" title="Microphone">Mic</button>
    <button type="button" class="icon" id="cam" title="Camera">Cam</button>
    <button type="button" class="icon" id="chatbtn" title="Chat">Chat</button>
    <button type="button" class="icon leave" id="leave">Leave</button>
  </div>
</div>

<aside id="chat">
  <div id="log"></div>
  <form id="chatform">
    <input id="typed" autocomplete="off" placeholder="Send a message" />
    <input id="file" type="file" />
    <button class="btn btn-join" type="submit">Send</button>
  </form>
</aside>

<script>
const stage = document.getElementById("stage");
const logEl = document.getElementById("log");
const status = document.getElementById("status");
const roomsEl = document.getElementById("rooms");
const preview = document.getElementById("preview");
const previewOff = document.getElementById("preview-off");
const typed = document.getElementById("typed");
let roomId = "", memberId = "", since = 0, live = false, busy = false;
let rec, chunks, stream, analyser, audioCtx, sourceNode, vadTimer;
let mediaGeneration = 0, sessionGeneration = 0;
let heard = false, speechAt = 0, lastLoud = 0;
let camOn = true, micOn = true, members = [];
const SILENCE_MS = 1100, MIN_SPEECH_MS = 280, SPEECH_RMS = 0.018;
const talkingUntil = new Map();
const talkingTimers = new Map();
const tileById = new Map();

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }
function setStatus(s) { status.textContent = s; document.getElementById("lobby-status").textContent = s; }
function initials(name) {
  const p = String(name || "?").trim().split(/\s+/);
  return ((p[0]?.[0] || "?") + (p[1]?.[0] || "")).toUpperCase();
}
function hue(id) {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

async function api(path, init) {
  const r = await fetch(path, init);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function bubble(who, text, files) {
  const row = document.createElement("div");
  row.className = "msg";
  let extra = "";
  if (files?.length) extra = files.map((f) => `<div class="kind">📎 ${esc(f.name)}</div>`).join("");
  row.innerHTML = `<b>${esc(who)}</b>${esc(text || "")}${extra}`;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function attachLocalVideo(el) {
  if (!el || !stream) return;
  const vtrack = stream.getVideoTracks().find((t) => t.readyState === "live" && t.enabled);
  if (!vtrack || !camOn) return;
  el.srcObject = stream;
  el.play().catch(() => {});
}

function renderMembers(list) {
  members = list || members;
  const n = Math.max(1, members.length);
  stage.className = "n" + Math.min(n, 6);
  const now = Date.now();
  const seen = new Set();
  for (const m of members) {
    seen.add(m.id);
    const selfCam = m.id === memberId && camOn && stream?.getVideoTracks?.().some((t) => t.readyState === "live" && t.enabled);
    const sig = JSON.stringify([m.id, m.name, m.kind, m.role || "", selfCam ? 1 : 0]);
    const talk = (talkingUntil.get(m.id) || 0) > now;
    let el = tileById.get(m.id);
    if (el && el.dataset.sig === sig) {
      el.classList.toggle("talk", talk);
      continue;
    }
    if (el) { el.remove(); tileById.delete(m.id); }
    el = document.createElement("div");
    el.className = "tile" + (m.id === memberId ? " you" : "") + (talk ? " talk" : "");
    el.dataset.id = m.id;
    el.dataset.sig = sig;
    if (selfCam) {
      el.innerHTML = `<video autoplay muted playsinline></video><div class="meta">${esc(m.name)} <span class="kind">${esc(m.kind)}${m.role ? " · " + esc(m.role) : ""}</span></div>`;
      stage.appendChild(el);
      attachLocalVideo(el.querySelector("video"));
    } else {
      el.innerHTML = `<div class="avatar" style="background:hsl(${hue(m.id)} 35% 28%)">${esc(initials(m.name))}</div><div class="meta">${esc(m.name)} <span class="kind">${esc(m.kind)}${m.role ? " · " + esc(m.role) : ""}</span></div>`;
      stage.appendChild(el);
    }
    tileById.set(m.id, el);
  }
  for (const [id, el] of tileById) {
    if (!seen.has(id)) {
      el.remove();
      tileById.delete(id);
    }
  }
}

function markTalking(id, ms = 2500) {
  const until = Date.now() + ms;
  talkingUntil.set(id, until);
  const tile = tileById.get(id);
  if (tile) tile.classList.add("talk");
  const existing = talkingTimers.get(id);
  if (existing) clearTimeout(existing);
  talkingTimers.set(id, setTimeout(() => {
    talkingTimers.delete(id);
    if (Date.now() >= (talkingUntil.get(id) || 0)) {
      talkingUntil.delete(id);
      const t = tileById.get(id);
      if (t) t.classList.remove("talk");
    }
  }, ms + 50));
}

async function refreshRooms() {
  const j = await api("/api/rooms");
  const cur = roomsEl.value;
  roomsEl.innerHTML = '<option value="">New meeting</option>';
  for (const r of j.rooms || []) {
    const o = document.createElement("option");
    o.value = r.id;
    o.textContent = `${r.name}`;
    roomsEl.appendChild(o);
  }
  if (cur) roomsEl.value = cur;
}

async function getWithTimeout(constraints) {
  let timer, timedOut = false;
  const raw = navigator.mediaDevices.getUserMedia(constraints);
  raw.catch(() => {}); // suppress late unhandled rejection after timeout
  const media = raw.then((s) => {
    if (timedOut) s.getTracks().forEach((t) => t.stop());
    return s;
  });
  const wait = new Promise((_, rej) => {
    timer = setTimeout(() => { timedOut = true; rej(new Error("media timeout")); }, 2500);
  });
  return Promise.race([media, wait]).finally(() => clearTimeout(timer));
}

async function ensureMedia() {
  const myGen = ++mediaGeneration;
  const wantVideo = camOn;
  if (stream) {
    stream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
    stream.getVideoTracks().forEach((t) => { t.enabled = camOn; });
    if (wantVideo && !stream.getVideoTracks().some((t) => t.readyState === "live")) {
      const current = stream;
      try {
        const videoOnly = await getWithTimeout({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        });
        if (myGen !== mediaGeneration) { videoOnly.getTracks().forEach((t) => t.stop()); return; }
        if (stream !== current) { videoOnly.getTracks().forEach((t) => t.stop()); return; }
        current.getVideoTracks().forEach((t) => { t.stop(); current.removeTrack(t); });
        videoOnly.getVideoTracks().forEach((t) => current.addTrack(t));
      } catch (e) {
        if (myGen !== mediaGeneration) return;
        camOn = false;
        syncMediaButtons();
        setStatus("Camera unavailable; using microphone only");
      }
    }
  }
  if (!stream) {
    const constraints = {
      audio: { echoCancellation: true, noiseSuppression: true },
      video: wantVideo ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } : false,
    };
    try {
      const newStream = await getWithTimeout(constraints);
      if (myGen !== mediaGeneration) { newStream.getTracks().forEach((t) => t.stop()); return; }
      stream = newStream;
    } catch (firstErr) {
      if (myGen !== mediaGeneration) return;
      if (!wantVideo) throw firstErr;
      camOn = false;
      syncMediaButtons();
      setStatus("Camera unavailable; using microphone only");
      const fallback = await getWithTimeout({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: false,
      });
      if (myGen !== mediaGeneration) { fallback.getTracks().forEach((t) => t.stop()); return; }
      stream = fallback;
    }
    stream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
  }
  audioCtx = audioCtx || new AudioContext();
  if (audioCtx.state === "suspended") await audioCtx.resume();
  if (myGen !== mediaGeneration) {
    stream?.getTracks().forEach((t) => t.stop());
    return;
  }
  if (!analyser || sourceNode?.mediaStream !== stream) {
    if (sourceNode) try { sourceNode.disconnect(); } catch {}
    sourceNode = audioCtx.createMediaStreamSource(stream);
    analyser = analyser || audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    sourceNode.connect(analyser);
  }
  preview.srcObject = camOn ? stream : null;
  previewOff.style.display = camOn ? "none" : "flex";
  preview.style.display = camOn ? "block" : "none";
}

function syncMediaButtons() {
  for (const id of ["mic", "lobby-mic"]) document.getElementById(id).classList.toggle("off", !micOn);
  for (const id of ["cam", "lobby-cam"]) document.getElementById(id).classList.toggle("off", !camOn);
}

async function joinMeeting() {
  try { await ensureMedia(); } catch (e) { camOn = false; micOn = false; syncMediaButtons(); setStatus(e.message || "Joining without camera"); }
  if (!roomsEl.value) {
    const name = document.getElementById("newroom").value.trim() || "Meeting";
    const r = await api("/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
    await refreshRooms();
    roomsEl.value = r.id;
  }
  roomId = roomsEl.value;
  const thisRoom = roomId;
  const mySession = ++sessionGeneration;
  const role = document.getElementById("myrole").value.trim();
  const j = await api(`/api/rooms/${thisRoom}/join`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: "human", name: role || "You", role: role || "host" }),
  });
  if (mySession !== sessionGeneration || roomId !== thisRoom) {
    const staleMemberId = j?.member?.id;
    if (staleMemberId) {
      api(`/api/rooms/${thisRoom}/leave`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ memberId: staleMemberId }),
      }).catch(() => {});
    }
    return;
  }
  memberId = j.member.id;
  since = j.room.seq;
  renderMembers(j.room.members);
  document.body.classList.add("in-call");
  setStatus(j.room.name || roomId);
  live = micOn;
  if (live) listen();
}

async function leaveMeeting() {
  live = false;
  mediaGeneration++;
  sessionGeneration++;
  if (vadTimer) cancelAnimationFrame(vadTimer);
  const oldRec = rec;
  if (oldRec && oldRec.state !== "inactive") oldRec.stop();
  if (!busy) rec = null;
  if (memberId && roomId) {
    await api(`/api/rooms/${roomId}/leave`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ memberId }),
    }).catch(() => {});
  }
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  analyser = null;
  sourceNode = null;
  talkingUntil.clear();
  for (const t of talkingTimers.values()) clearTimeout(t);
  talkingTimers.clear();
  for (const el of tileById.values()) el.remove();
  tileById.clear();
  memberId = "";
  roomId = "";
  document.body.classList.remove("in-call", "chat-open");
  await ensureMedia().catch(() => {});
  setStatus("Left the meeting");
}

async function tick() {
  if (!roomId) return;
  const mySession = sessionGeneration;
  const thisRoom = roomId;
  const j = await api(`/api/rooms/${thisRoom}/events?since=${since}`);
  if (roomId !== thisRoom || mySession !== sessionGeneration) return;
  renderMembers(j.room.members);
  for (const e of j.events || []) {
    since = e.seq;
    if (e.type === "message") {
      bubble(e.memberId === memberId ? "You" : (e.name + (e.role ? ` · ${e.role}` : "")), e.text, e.files);
      if (e.audio && e.memberId !== memberId) {
        markTalking(e.memberId, 4000);
        const a = new Audio(e.audio);
        a.play().catch(() => {});
        const audioSession = sessionGeneration;
        a.onended = () => {
          if (audioSession !== sessionGeneration) return;
          talkingUntil.set(e.memberId, Date.now());
          const t = tileById.get(e.memberId);
          if (t) t.classList.remove("talk");
        };
      }
    }
    if (e.type === "join") bubble("sys", `${e.name} joined`);
    if (e.type === "leave") bubble("sys", `${e.name} left`);
    if (e.type === "role") bubble("sys", `${e.name} is now ${e.role}`);
  }
}

async function sendChat(text, files) {
  await api(`/api/rooms/${roomId}/messages`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ memberId, text, files: files || [] }),
  });
}

async function shareFile(file) {
  const text = await file.text().catch(() => "");
  await api(`/api/rooms/${roomId}/files`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ memberId, name: file.name, text: text.slice(0, 20000), caption: "shared " + file.name }),
  });
}

function mime() {
  return ["audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
}
function level() {
  if (!analyser) return 0;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let s = 0;
  for (const x of buf) s += x * x;
  return Math.sqrt(s / buf.length);
}
function startRecorder() {
  if (rec || !stream) return;
  chunks = []; heard = false; speechAt = 0; lastLoud = 0;
  const recStream = new MediaStream(stream.getAudioTracks());
  const t = mime();
  rec = t ? new MediaRecorder(recStream, { mimeType: t }) : new MediaRecorder(recStream);
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.start(200);
}
function vadTick() {
  if (!live || busy || !rec) return;
  const rms = level(), now = Date.now();
  if (rms > SPEECH_RMS) {
    if (!heard) { heard = true; speechAt = now; setStatus("You're talking"); }
    lastLoud = now;
    markTalking(memberId, 600);
  } else if (heard && now - speechAt >= MIN_SPEECH_MS && now - lastLoud >= SILENCE_MS) {
    endUtterance();
    return;
  }
  vadTimer = requestAnimationFrame(vadTick);
}
async function endUtterance() {
  if (!rec || busy) return;
  busy = true;
  const thisRec = rec;
  if (!thisRec) { busy = false; return; }
  if (vadTimer) cancelAnimationFrame(vadTimer);
  const done = thisRec.state === "inactive" ? Promise.resolve() : new Promise((res) => thisRec.addEventListener("stop", res, { once: true }));
  if (thisRec.state !== "inactive") thisRec.stop();
  await done;
  const blob = new Blob(chunks, { type: thisRec.mimeType || "audio/webm" });
  rec = null;
  try {
    if (blob.size > 800) {
      await fetch(`/api/rooms/${roomId}/audio?memberId=${encodeURIComponent(memberId)}`, {
        method: "POST",
        headers: { "Content-Type": blob.type.split(";")[0] || "audio/webm" },
        body: blob,
      }).then((r) => r.json()).then((j) => { if (j.error) throw new Error(j.error); });
    }
  } catch (e) { setStatus(e.message); }
  busy = false;
  if (live) listen();
}
async function listen() {
  if (!live || busy || !micOn) return;
  await ensureMedia();
  if (!live || busy || !micOn) return;
  await new Promise((r) => setTimeout(r, 150));
  if (!live || busy || !micOn) return;
  startRecorder();
  setStatus("Listening");
  vadTick();
}

document.getElementById("join").onclick = () => joinMeeting().catch((e) => setStatus(e.message));
document.getElementById("leave").onclick = () => leaveMeeting().catch((e) => setStatus(e.message));
document.getElementById("chatbtn").onclick = () => document.body.classList.toggle("chat-open");
function toggleMic() {
  micOn = !micOn;
  stream?.getAudioTracks().forEach((t) => { t.enabled = micOn; });
  live = micOn && document.body.classList.contains("in-call");
  syncMediaButtons();
  if (live) listen();
  else if (vadTimer) cancelAnimationFrame(vadTimer);
}
function toggleCam() {
  camOn = !camOn;
  stream?.getVideoTracks().forEach((t) => { t.enabled = camOn; });
  if (camOn && stream && !stream.getVideoTracks().some((t) => t.readyState === "live")) {
    ensureMedia().then(() => renderMembers(members)).catch((e) => setStatus(e.message));
  } else {
    preview.srcObject = camOn ? stream : null;
    previewOff.style.display = camOn ? "none" : "flex";
    renderMembers(members);
  }
  syncMediaButtons();
}
document.getElementById("mic").onclick = toggleMic;
document.getElementById("lobby-mic").onclick = toggleMic;
document.getElementById("cam").onclick = toggleCam;
document.getElementById("lobby-cam").onclick = toggleCam;
document.getElementById("chatform").onsubmit = async (e) => {
  e.preventDefault();
  const t = typed.value.trim();
  const file = document.getElementById("file").files[0];
  typed.value = "";
  try {
    if (file) { await shareFile(file); document.getElementById("file").value = ""; }
    if (t) await sendChat(t);
  } catch (err) { setStatus(err.message); }
};
ensureMedia().catch((e) => setStatus(e.message || "Allow camera and mic"));
refreshRooms().catch(() => {});
setInterval(() => { refreshRooms().catch(() => {}); tick().catch(() => {}); }, 1000);
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("room")) {
    await refreshRooms().catch(() => {});
    if (![...roomsEl.options].some((o) => o.value === q.get("room"))) {
      document.getElementById("newroom").value = q.get("room");
    } else roomsEl.value = q.get("room");
    if (q.get("name")) document.getElementById("myrole").value = q.get("name");
    if (q.get("join") === "1") await joinMeeting();
  }
})().catch((e) => setStatus(e.message));
</script>
