<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Meet</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --mut:#8b949e; --you:#3fb950; --talk:#d29922; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font: 15px/1.4 ui-sans-serif, system-ui; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  select, button, input { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; }
  button.rec { background:#da3633; border-color:#f85149; }
  .wrap { flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(260px, 380px); min-height:0; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:10px; padding:12px; overflow:auto; align-content:start; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; min-height:90px; padding:12px; min-width:0; }
  .tile.you { border-color:var(--you); }
  .who { font-weight:600; overflow-wrap:anywhere; }
  .role { color:var(--mut); font-size:12px; overflow-wrap:anywhere; }
  #chat { display:flex; flex-direction:column; min-width:0; border-left:1px solid var(--line); background:var(--card); }
  #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow-wrap:anywhere; }
  .msg.me { border-color:var(--you); }
  .msg b { display:block; font-size:12px; color:var(--mut); }
  #chatform { display:flex; flex-wrap:wrap; gap:8px; padding:10px; border-top:1px solid var(--line); }
  #typed { flex:1; min-width:120px; }
  #status { margin-left:auto; color:var(--mut); font-size:13px; }
</style>
<header>
  <h1>Pi Meet</h1>
  <select id="rooms"><option value="">(no rooms)</option></select>
  <input id="newroom" placeholder="new room name" size="14" />
  <button type="button" id="create">Create</button>
  <button type="button" id="enter">Join</button>
  <input id="myrole" placeholder="your role (optional)" size="14" />
  <button type="button" id="talk">Voice</button>
  <span id="status">pick a room</span>
</header>
<div class="wrap">
  <main id="grid"></main>
  <aside id="chat">
    <div id="log"></div>
    <form id="chatform">
      <input id="typed" autocomplete="off" placeholder="Chat — Enter. /sales hi  or attach a file" />
      <input id="file" type="file" />
      <button type="submit">Send</button>
    </form>
  </aside>
</div>
<script>
const grid = document.getElementById("grid");
const logEl = document.getElementById("log");
const status = document.getElementById("status");
const roomsEl = document.getElementById("rooms");
const talkBtn = document.getElementById("talk");
const typed = document.getElementById("typed");
let roomId = "", memberId = "", since = 0, live = false, busy = false;
let rec, chunks, stream, analyser, audioCtx, sourceNode, vadTimer;
let heard = false, speechAt = 0, lastLoud = 0;
const SILENCE_MS = 1100, MIN_SPEECH_MS = 280, SPEECH_RMS = 0.018;

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }
function setStatus(s) { status.textContent = s; }
function bubble(who, text, files) {
  const row = document.createElement("div");
  row.className = "msg" + (who === "You" ? " me" : "");
  let extra = "";
  if (files?.length) extra = files.map((f) => `<div class="role">📎 ${esc(f.name)}${f.path ? " — " + esc(f.path) : ""}</div>`).join("");
  row.innerHTML = `<b>${esc(who)}</b>${esc(text || "")}${extra}`;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

async function api(path, init) {
  const r = await fetch(path, init);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function renderMembers(members) {
  grid.innerHTML = "";
  for (const m of members || []) {
    const el = document.createElement("div");
    el.className = "tile" + (m.id === memberId ? " you" : "");
    el.innerHTML = `<div class="who">${esc(m.name)}</div><div class="role">${esc(m.kind)} · ${esc(m.role || "choosing role…")}</div>`;
    grid.appendChild(el);
  }
}

async function refreshRooms() {
  const j = await api("/api/rooms");
  const cur = roomsEl.value;
  roomsEl.innerHTML = "";
  for (const r of j.rooms || []) {
    const o = document.createElement("option");
    o.value = r.id;
    o.textContent = `${r.name} (${r.id})`;
    roomsEl.appendChild(o);
  }
  if (!roomsEl.options.length) {
    const o = document.createElement("option");
    o.value = "";
    o.textContent = "(no rooms)";
    roomsEl.appendChild(o);
  }
  if (cur) roomsEl.value = cur;
}

async function createRoom() {
  const name = document.getElementById("newroom").value.trim() || "room";
  const r = await api("/api/rooms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
  await refreshRooms();
  roomsEl.value = r.id;
  await enterRoom();
}

async function enterRoom() {
  roomId = roomsEl.value;
  if (!roomId) throw new Error("create a room first");
  const role = document.getElementById("myrole").value.trim();
  const j = await api(`/api/rooms/${roomId}/join`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: "human", name: "You", role }),
  });
  memberId = j.member.id;
  since = j.room.seq;
  renderMembers(j.room.members);
  setStatus("in " + roomId);
}

async function tick() {
  if (!roomId) return;
  const j = await api(`/api/rooms/${roomId}/events?since=${since}`);
  renderMembers(j.room.members);
  for (const e of j.events || []) {
    since = e.seq;
    if (e.type === "message") {
      bubble(e.memberId === memberId ? "You" : (e.name + (e.role ? ` · ${e.role}` : "")), e.text, e.files);
      if (e.audio && e.memberId !== memberId) {
        const a = new Audio(e.audio);
        a.play().catch(() => {});
      }
    }
    if (e.type === "join") bubble("sys", `${e.name} joined${e.role ? " as " + e.role : ""}`);
    if (e.type === "role") bubble("sys", `${e.name} is now ${e.role}`);
  }
}

async function sendChat(text, files) {
  if (!memberId) await enterRoom();
  await api(`/api/rooms/${roomId}/messages`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ memberId, text, files: files || [] }),
  });
}

async function shareFile(file) {
  if (!memberId) await enterRoom();
  const text = await file.text().catch(() => "");
  await api(`/api/rooms/${roomId}/files`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ memberId, name: file.name, text: text.slice(0, 20000), caption: "shared " + file.name }),
  });
}

function mime() {
  return ["audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
}
function level() {
  if (!analyser) return 0;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let s = 0;
  for (const x of buf) s += x * x;
  return Math.sqrt(s / buf.length);
}
async function ensureMic() {
  if (stream?.getAudioTracks?.().some((t) => t.readyState === "live") && analyser) {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    return;
  }
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  audioCtx = audioCtx || new AudioContext();
  if (audioCtx.state === "suspended") await audioCtx.resume();
  sourceNode = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  sourceNode.connect(analyser);
}
function startRecorder() {
  if (rec || !stream) return;
  chunks = []; heard = false; speechAt = 0; lastLoud = 0;
  const recStream = stream.clone();
  const t = mime();
  rec = t ? new MediaRecorder(recStream, { mimeType: t }) : new MediaRecorder(recStream);
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.addEventListener("stop", () => recStream.getTracks().forEach((tr) => tr.stop()));
  rec.start(200);
}
function vadTick() {
  if (!live || busy || !rec) return;
  const rms = level(), now = Date.now();
  if (rms > SPEECH_RMS) {
    if (!heard) { heard = true; speechAt = now; setStatus("listening"); }
    lastLoud = now;
  } else if (heard && now - speechAt >= MIN_SPEECH_MS && now - lastLoud >= SILENCE_MS) {
    endUtterance();
    return;
  }
  vadTimer = requestAnimationFrame(vadTick);
}
async function endUtterance() {
  if (!rec || busy) return;
  busy = true;
  if (vadTimer) cancelAnimationFrame(vadTimer);
  const done = new Promise((res) => rec.addEventListener("stop", res, { once: true }));
  if (rec.state !== "inactive") rec.stop();
  await done;
  const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
  rec = null;
  try {
    if (blob.size > 800) {
      if (!memberId) await enterRoom();
      await fetch(`/api/rooms/${roomId}/audio?memberId=${encodeURIComponent(memberId)}`, {
        method: "POST",
        headers: { "Content-Type": blob.type.split(";")[0] || "audio/webm" },
        body: blob,
      }).then((r) => r.json()).then((j) => { if (j.error) throw new Error(j.error); });
    }
  } catch (e) { setStatus(e.message); }
  busy = false;
  if (live) listen();
}
async function listen() {
  if (!live || busy) return;
  await ensureMic();
  await new Promise((r) => setTimeout(r, 150));
  startRecorder();
  setStatus("speak or type");
  vadTick();
}
async function voiceOn() {
  if (!window.isSecureContext) { setStatus("mic needs HTTPS :8791"); return; }
  if (!memberId) await enterRoom();
  live = true;
  talkBtn.classList.add("rec");
  talkBtn.textContent = "Mute";
  listen();
}
function voiceOff() {
  live = false;
  if (vadTimer) cancelAnimationFrame(vadTimer);
  if (rec && rec.state !== "inactive") rec.stop();
  rec = null;
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  talkBtn.classList.remove("rec");
  talkBtn.textContent = "Voice";
  setStatus("in " + roomId);
}

document.getElementById("create").onclick = () => createRoom().catch((e) => setStatus(e.message));
document.getElementById("enter").onclick = () => enterRoom().catch((e) => setStatus(e.message));
talkBtn.onclick = () => { if (live) voiceOff(); else voiceOn().catch((e) => setStatus(e.message)); };
document.getElementById("chatform").onsubmit = async (e) => {
  e.preventDefault();
  const t = typed.value.trim();
  const file = document.getElementById("file").files[0];
  typed.value = "";
  try {
    if (file) { await shareFile(file); document.getElementById("file").value = ""; }
    if (t) await sendChat(t);
  } catch (err) { setStatus(err.message); }
};
refreshRooms().catch(() => {});
setInterval(() => { refreshRooms().catch(() => {}); tick().catch(() => {}); }, 1000);
if (!window.isSecureContext) setStatus("chat ok · mic: https://192.168.68.55:8791");
</script>
